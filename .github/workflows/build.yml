name: Build APK and draft release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unsigned:
    name: Unsigned validation build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate version and required additions/fixes release notes
        run: python3 tools/cloud_release.py plan
      - name: Source gates and offline regression tests
        run: python3 tools/project.py test
      - name: Prepare public pinned toolchain (no signing material)
        run: python3 tools/prepare_ci.py
      - name: Compile, dex, package and audit unsigned APK
        run: sh build.sh --unsigned
      - name: Package exact unsigned APK, notes and provenance
        run: python3 tools/cloud_release.py package-unsigned
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acefan-unsigned-${{ github.sha }}
          path: |
            dist/ci/*-unsigned.apk
            dist/ci/BUILD_INFO.json
            dist/ci/RELEASE_NOTES.md
            dist/ci/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  signed-draft:
    name: Original-signature draft (version tags only)
    needs: unsigned
    if: github.repository == 'bianwuya/ace7pro-fan' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fail closed if original signing secrets are not configured
        env:
          ACEFAN_KEYSTORE_B64: ${{ secrets.ACEFAN_KEYSTORE_B64 }}
          ACEFAN_STORE_PASSWORD: ${{ secrets.ACEFAN_STORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, sys
          if not all(os.environ.get(k) for k in ('ACEFAN_KEYSTORE_B64', 'ACEFAN_STORE_PASSWORD')):
              sys.exit('Original signing Secrets are missing. No key generation, debug-signing or unsigned Release fallback is allowed.')
          PY
      - name: Validate exact tag/version/main ancestry and versionCode
        run: python3 tools/cloud_release.py plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: acefan-unsigned-${{ github.sha }}
          path: dist/ci
      - name: Prepare SDK signature audit tools
        run: python3 tools/prepare_ci.py
      - name: Sign same-run artifact with original identity and audit
        env:
          ACEFAN_KEYSTORE_B64: ${{ secrets.ACEFAN_KEYSTORE_B64 }}
          ACEFAN_STORE_PASSWORD: ${{ secrets.ACEFAN_STORE_PASSWORD }}
        run: python3 tools/cloud_release.py sign
      - name: Create draft with mandatory 新增 and 修复 notes (never Publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/cloud_release.py draft
      - name: Always remove temporary signing files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/acefan-signing"
